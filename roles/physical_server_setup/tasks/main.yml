---
- name: yum update
  yum: name=* state=latest

- name: Add history time formart
  lineinfile: dest=/etc/bashrc state=present regexp="HISTTIMEFORMAT='%y/%m/%d %H:%M:%S'" line="HISTTIMEFORMAT='%y/%m/%d %H:%M:%S'"

- name: Change hostname
  shell: hostname {{ inventory_hostname }}
  when: ansible_hostname != inventory_hostname

- name: Change dns server
  template: src=resolv.conf.j2 dest=/etc/resolv.conf

- name: write sysconfig_network file
  template: src=network.j2 dest=/etc/sysconfig/network
  notify:
  - restart network

- name: write sysconfig_network_br4093 file
  template: src=ifcfg-br4093.j2 dest=/etc/sysconfig/network-scripts/ifcfg-br4093
  notify:
  - restart network

- name: change sshd_config for ssh_port
  lineinfile: dest=/etc/ssh/sshd_config regexp="#Port 22" line="Port 10022" backrefs=yes
  notify:
  - restart sshd

- name: change iptables for ssh_port
  lineinfile: dest=/etc/sysconfig/iptables regexp="--dport 22 -j ACCEPT" line="-A INPUT -m state --state NEW -m tcp -p tcp --dport 10022 -j ACCEPT" backrefs=yes
  notify:
  - restart iptables
