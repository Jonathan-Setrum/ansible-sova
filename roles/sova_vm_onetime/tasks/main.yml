# Task#7800
- name: backup wp-config.php
  shell: cp /var/www/html/wp-config.php "/tmp/wp-config.php.$(date +%Y-%m-%d)"
  tags:
    - wpconfig_7800
- name: remove Sova WP Settings Comment from wp-config.php
  lineinfile: dest="/var/www/html/wp-config.php" state=absent regexp='^(.*)(BEGIN|END) Sova WP Settings(.*)$'
  tags:
    - wpconfig_7800
- name: remove VHP_VARNISH_IP from wp-config.php
  lineinfile: dest="/var/www/html/wp-config.php" state=absent regexp='^(.*)VHP_VARNISH_IP(.*)$'
  tags:
    - wpconfig_7800
- name: rm -f /usr/share/php/real-ip.php
  command: rm -f /usr/share/php/real-ip.php
  tags:
    - wpconfig_7800
