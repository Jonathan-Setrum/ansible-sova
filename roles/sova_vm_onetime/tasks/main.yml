# Task#8414
- name: stat apache_wordpress_conf
  stat: path=/etc/fail2ban/filter.d/apache-wordpress.conf
  register: apache_wordpress_conf
  tags:
    - fail2ban_8414
- name: mv /etc/fail2ban/filter.d/apache-wordpress.conf
  command: mv /etc/fail2ban/filter.d/apache-wordpress.conf /etc/fail2ban/filter.d/wordpress.conf
  when: apache_wordpress_conf.stat.exists
  tags:
    - fail2ban_8414
  notify:
    - fail2ban restart
    - iptables restart

