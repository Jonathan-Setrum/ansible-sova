---
- name: Add CentOS repository to RedHat 
  template: src=CentOS-Base.repo.j2 dest=/etc/yum.repos.d/CentOS-Base.repo
  when: ansible_distribution == 'RedHat'

- name: Add releasever to RedHat
  template: src=releasever.j2 dest=/etc/yum/vars/releasever
  when: ansible_distribution == 'RedHat'
  
- name: Add RPM-GPG-KEY-CentOS-6 to RedHat
  copy: src=RPM-GPG-KEY-CentOS-6 dest=/etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-6
  when: ansible_distribution == 'RedHat'
  
- name: install the latest necessary packages
  yum: name={{ item }} state=latest
  with_items:
    - oddjob-mkhomedir
    - nscd
    - nss-pam-ldapd
    - openldap-clients
    - openssh-ldap

