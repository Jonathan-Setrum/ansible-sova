- name: start services
  service: name={{ item }} enabled=yes state=started
  with_items:
    - messagebus
    - oddjobd

- set_fact: colon=":"

- name: configurate authentication
  command: /usr/sbin/authconfig --update --passalgo=sha512 --enableldap --enableldapauth --ldapserver=ldap://{{ midx_ldap01_interface }}:389,ldap://{{ midx_ldap02_interface }}:389 --ldapbasedn={{ midx_domain_suffix }} --enablemkhomedir

- name: configure bind DN in pam_ldap.conf
  lineinfile: dest=/etc/pam_ldap.conf regexp='^binddn ' line="binddn {{ midx_domain_root_dn }}" state=present

- name: configure bind password in pam_ldap.conf
  lineinfile: dest=/etc/pam_ldap.conf regexp='^bindpw' line="bindpw {{ midx_domain_rootdn_password }}" state=present

- name: configure password change protocol in pam_ldap.conf
  lineinfile: dest=/etc/pam_ldap.conf regexp='^pam_password' line="pam_password exop" state=present

- name: configure sshd in /etc/ssh/sshd_config
  lineinfile: dest="/etc/ssh/sshd_config"
              insertafter="^#AuthorizedKeysCommandRunAs"
              line="AuthorizedKeysCommand /usr/libexec/openssh/ssh-ldap-wrapper"

- name: configure sshd in /etc/ssh/sshd_config
  lineinfile: dest="/etc/ssh/sshd_config"
              insertafter="^AuthorizedKeysCommand"
              line="AuthorizedKeysCommandRunAs root"

- name: copy ldap.conf to /etc/ssh/
  template: src=ldap.conf.j2 dest=/etc/ssh/ldap.conf owner=root group=root mode=0600 force=yes

- name: change nslcd.conf
  template: src=nslcd.conf.j2 dest=/etc/nslcd.conf owner=root group=root mode=0600 force=yes

- name: change sss to ldap in /etc/pam.d/system-auth
  command: sed -i "s/pam_sss.so/pam_ldap.so/g" /etc/pam.d/system-auth

- name: change sss to ldap in /etc/nsswitch.conf
  command: sed -i "s/files sss/files ldap/g" /etc/nsswitch.conf

- name: restart services
  service: name={{ item }} enabled=yes state=restarted
  with_items:
    - sshd
    - nslcd

- name: change permission of /etc/sudoers file
  file: path=/etc/sudoers state=file owner=root group=root mode=0640

- name: change /etc/sudoers file
  lineinfile: dest="/etc/sudoers"
              insertafter="^## Same thing without a password"
              line="%{{ midx_group }} ALL=(ALL) NOPASSWD{{ colon }} ALL"

- name: change permission of /etc/sudoers file
  file: path=/etc/sudoers state=file owner=root group=root mode=0440
