---

- name: change remi.repo
  template: src={{ item }}.j2 dest=/etc/yum.repos.d/{{ item }} backup=yes
  with_items:
    - remi.repo

- name: update php package
  yum: name={{ item }} state=latest
  with_items:
  - php
  notify:
  - restart httpd

- name: change php.ini file (php)
  template: src={{ item }}.j2 dest=/etc/{{ item }} backup=yes
  tags:
    - php
  with_items:
    - php.ini
  notify:
    - restart httpd

- name: upload prepend.php
  template: src=prepend.php dest=/usr/share/php/prepend.php owner=root group=root mode=0644
  tags: php
  notify:
  - restart httpd

- name: check and change /var/lib/php/session (php)
  file: path={{ item }} owner=500 group=500 state=directory
  with_items:
  - /var/lib/php/session
  notify:
  - restart httpd

- name: check and change /var/www (apache)
  file: path={{ item }} owner=root group=root state=directory mode=0755
  with_items:
  - /var/www

- name: check and change user to /var/www/html on sova_vm and sovafree_vm (apache)
  file: path={{ item }} owner=500 group=500 state=directory recurse=yes
  with_items:
  - /var/www/html
  when: "'sova_vm' in group_names or 'sovafree_vm' in group_names or 'sova_vm_test' in group_names or 'sovafree_vm_test' in group_names"

- name: check and change permission to /var/www/html on sova_vm and sovafree_vm (apache)
  file: path={{ item }} state=directory mode=0755
  with_items:
  - /var/www/html
  when: "'sova_vm' in group_names or 'sovafree_vm' in group_names or 'sova_vm_test' in group_names or 'sovafree_vm_test' in group_names"

- name: moving the file and deleting /var/www/icons (apache)
  shell: mv -f /var/www/icons/* /var/www2/icons; rm -rf /var/www/icons

- name: check and change /usr/bin/which and /usr/bin/php (command)
  file: path={{ item }} owner=root group=root state=file mode=0755
  with_items:
  - /usr/bin/which
  - /usr/bin/php

- name: check and change /usr/bin/unzip and /usr/bin/zipinfo (command)
  command: chmod 700 {{ item }}
  with_items:
  - /usr/bin/unzip
  - /usr/bin/zipinfo

- name: check and change /usr/bin/wget (command)
  file: path={{ item }} owner=root group=root state=file mode=0000
  with_items:
  - /usr/bin/wget
